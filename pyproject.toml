[project]
name = "graphops-ai"
version = "0.1.0"
description = "An AI knowledge platform that converts enterprise documents into a knowledge graph, performs GraphRAG-based reasoning, serves Hugging Face models through vLLM, schedules GPU inference workloads, evaluates retrieval/generation quality, and coordinates specialized agents through A2A."
authors = [
    {name = "Alireza Aliabadi"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
mypy = ">=1.15,<2.0"
pytest = ">=8.3,<9.0"
ruff = ">=0.11,<1.0"
httpx2 = ">=2.0,<3.0"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src", "."]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_any_generics = true
warn_unused_ignores = true
exclude = ["\\.venv"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
